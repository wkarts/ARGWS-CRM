name: ${COMPOSE_PROJECT_NAME:-argws-crm-develop}
services:
  storage-init:
    image: ${ARGWS_CRM_IMAGE:-ghcr.io/wkarts/argws-crm:develop}
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for directory in installation_config uploads temp application_cache application_logs module_accounting_uploads module_finance_uploads module_fleet_uploads module_hr_payroll_uploads module_hr_profile_uploads module_invoices_builder_uploads module_ma_uploads module_products_uploads module_purchase_uploads module_service_management_uploads module_si_custom_theme_uploads module_timesheets_uploads caddy_data caddy_config; do
          mkdir -p "/storage/$directory"
          chown 33:33 "/storage/$directory"
        done
    volumes:
      - "${ARGWS_STORAGE_ROOT:-./storage}:/storage"
  web:
    image: ${ARGWS_CRM_IMAGE:-ghcr.io/wkarts/argws-crm:develop}
    container_name: ${COMPOSE_PROJECT_NAME:-argws-crm-develop}-web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      ARGWS_DB_HOST: ${ARGWS_DB_HOST:?Defina ARGWS_DB_HOST no arquivo .env}
      ARGWS_DB_NAME: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no arquivo .env}
      ARGWS_DB_USER: ${MYSQL_USER:?Defina MYSQL_USER no arquivo .env}
      ARGWS_DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env}
      ARGWS_SETUP_TOKEN: ${ARGWS_SETUP_TOKEN:-}
      ARGWS_CONFIG_DIR: /var/lib/argws-crm/config
    ports:
      - "${ARGWS_HTTP_BIND:-127.0.0.1}:${ARGWS_HTTP_PORT:-8088}:8080"
    depends_on:
      database:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - "${ARGWS_STORAGE_ROOT:-./storage}/installation_config:/var/lib/argws-crm/config"
      - "${ARGWS_STORAGE_ROOT:-./storage}/uploads:/app/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/temp:/app/temp"
      - "${ARGWS_STORAGE_ROOT:-./storage}/application_cache:/app/application/cache"
      - "${ARGWS_STORAGE_ROOT:-./storage}/application_logs:/app/application/logs"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_accounting_uploads:/app/modules/accounting/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_finance_uploads:/app/modules/finance/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_fleet_uploads:/app/modules/fleet/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_hr_payroll_uploads:/app/modules/hr_payroll/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_hr_profile_uploads:/app/modules/hr_profile/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_invoices_builder_uploads:/app/modules/invoices_builder/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_ma_uploads:/app/modules/ma/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_products_uploads:/app/modules/products/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_purchase_uploads:/app/modules/purchase/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_service_management_uploads:/app/modules/service_management/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_si_custom_theme_uploads:/app/modules/si_custom_theme/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/module_timesheets_uploads:/app/modules/timesheets/uploads"
      - "${ARGWS_STORAGE_ROOT:-./storage}/caddy_data:/data"
      - "${ARGWS_STORAGE_ROOT:-./storage}/caddy_config:/config"
  database:
    image: ${ARGWS_CRM_DATABASE_IMAGE:-ghcr.io/wkarts/argws-crm-mysql:8.0}
    container_name: ${COMPOSE_PROJECT_NAME:-argws-crm-develop}-database
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no arquivo .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no arquivo .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Gere MYSQL_PASSWORD com o deployer}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Gere MYSQL_ROOT_PASSWORD com o deployer}
    volumes:
      - "${ARGWS_STORAGE_ROOT:-./storage}/database_data:/var/lib/mysql"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping --protocol=tcp --host=127.0.0.1 --user=root
          --password="$$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
