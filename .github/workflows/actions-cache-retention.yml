name: Retenção segura do cache de Actions ARGWS CRM
on:
  workflow_run:
    workflows:
      - Containers ARGWS CRM
      - Release ARGWS CRM - SemVer, FrankenPHP e pacotes
    types: [completed]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      apply:
        description: Excluir caches elegíveis (padrão é somente relatório)
        type: boolean
        default: false
permissions:
  actions: write
  contents: read
concurrency:
  group: argws-crm-cache-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["main","develop"]'), github.event.workflow_run.head_branch) &&
       contains(fromJSON('[".github/workflows/container-publish.yml",".github/workflows/release-packages.yml"]'), github.event.workflow_run.path))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Limpar caches somente com repositório ocioso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_REQUESTED: ${{ github.event_name == 'workflow_run' || inputs.apply == true }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/cache-retention-report.json")
          if [[ "$APPLY_REQUESTED" == true ]]; then args+=(--apply); fi
          python3 scripts/cleanup_actions_cache.py "${args[@]}"
      - name: Guardar relatório da retenção
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argws-crm-cache-retention-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-retention-report.json
          if-no-files-found: ignore
          retention-days: 30
