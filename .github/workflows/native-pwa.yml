name: PWA nativo sem cache privado
on:
  pull_request:
    paths: ['pwa.php', 'assets/pwa/**', 'application/config/branding.php', 'application/views/**', 'tests/*native_pwa*', '.github/workflows/native-pwa.yml']
  push:
    branches: [main, develop]
    paths: ['pwa.php', 'assets/pwa/**', 'application/config/branding.php', 'application/views/**', 'tests/*native_pwa*', '.github/workflows/native-pwa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node --test tests/native_pwa.test.cjs
  http:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3
      - run: |
          php -l pwa.php
          php -l application/views/includes/pwa.php
          php -l application/config/branding.php
          python3 tests/test_native_pwa_http.py
  browser:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wkarts/argws-crm-ci-php@sha256:c6246e2740c225e7db4f0db2b8ba8657fb72cb9638efdedcfe1a8853fc081a14
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v5
      - name: Manifest, service worker e offline em HTTP real descartável
        env:
          PWA_BROWSER_ARTIFACTS: /tmp/native-pwa-fixture
        run: |
          php -l tests/native_pwa_router.php
          node tests/native_pwa_navigation.browser.cjs
          node tests/native_pwa.browser.cjs
      - name: Capturas sintéticas PWA e diagnósticos sem valores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-pwa-synthetic-browser
          path: /tmp/native-pwa-fixture
          if-no-files-found: warn
          retention-days: 7
