name: Banco do Brasil module
on:
  pull_request:
    branches: [main, develop, feat/banco-brasil-billing-cnab240]
    paths: ['modules/banco_brasil/**', 'tests/banco_brasil*', 'tests/support/BbPdoDatabase.php', 'docs/banco-brasil*', '.github/workflows/banco-brasil.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find modules/banco_brasil -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/banco_brasil_admin.php
      - run: php tests/banco_brasil_cnab240.php
      - run: php tests/banco_brasil_cnab400.php
      - run: php tests/banco_brasil_store.php
      - run: php tests/banco_brasil_layouts.php
      - run: php tests/banco_brasil_layout_migration.php
      - run: php tests/banco_brasil_module_version.php
      - run: php tests/banco_brasil_api_client.php
      - run: php tests/banco_brasil_mtls.php
      - run: python3 tests/banco_brasil_mtls_transport.py
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bb_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, mysqli
          coverage: none
      - run: php tests/banco_brasil_mysql.php && php tests/banco_brasil_layout_mysql.php && php tests/banco_brasil_mysql_driver.php
        env:
          MYSQL_DSN: mysql:host=127.0.0.1;dbname=bb_test;charset=utf8mb4
          MYSQL_USER: root
          MYSQL_PASSWORD: root

  mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-password
          MARIADB_DATABASE: bb_test
        ports: ['3306:3306']
        options: --health-cmd="mariadb-admin ping -psynthetic-ci-password" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_mysql, mysqli, curl, mbstring, bcmath
          coverage: none
      - name: Instalação, upgrade, drivers, origem e conciliação em MariaDB descartável
        env:
          MYSQL_DSN: mysql:host=127.0.0.1;dbname=bb_test;charset=utf8mb4
          MYSQL_USER: root
          MYSQL_PASSWORD: synthetic-ci-password
          ISSUERS_TEST_DSN: mysql:host=127.0.0.1;dbname=bb_test;charset=utf8mb4
          ISSUERS_TEST_USER: root
          ISSUERS_TEST_PASSWORD: synthetic-ci-password
        run: |
          php tests/banco_brasil_mysql.php
          php tests/banco_brasil_layout_mysql.php
          php tests/banco_brasil_mysql_driver.php
          php tests/issuers_core.php
          php tests/companies/clients.php
          php tests/companies/client_concurrency.php
          php tests/companies/portal_positive.php
          php tests/companies/portal_concurrency.php
          php tests/companies/portal_invoice_concurrency.php
          php tests/banco_brasil_origination_concurrency.php
          php tests/banco_brasil_reconciliation_concurrency.php
          php tests/banco_brasil_api_concurrency.php
          php tests/banco_brasil_api_receipt_concurrency.php
          php tests/banco_brasil_webhook_mysql.php
          php tests/banco_brasil_amendment_concurrency.php
