name: Versão e migrations do núcleo
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: core-release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  core-release-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar contrato canônico, aliases, artefatos e histórico
        run: python3 -m unittest tests/test_release_version.py tests/test_package_release.py tests/test_release_repair.py
      - name: Validar original head contra merge-base sem escrever arquivos
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-release-version.sh --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite
      - name: Confirmar tracking persistido, falha e replay no executor nativo
        run: php tests/native_migration_tracking.php
