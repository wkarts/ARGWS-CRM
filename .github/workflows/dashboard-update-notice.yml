name: Aviso de atualização do painel
on:
  pull_request:
    branches: [main, develop, feat/banco-brasil-billing-cnab240]
    paths:
      - application/helpers/misc_helper.php
      - application/vendor/ezyang/htmlpurifier/**
      - tests/dashboard_update_notice.php
      - .github/workflows/dashboard-update-notice.yml
  push:
    branches: [main, develop]
    paths:
      - application/helpers/misc_helper.php
      - application/vendor/ezyang/htmlpurifier/**
      - tests/dashboard_update_notice.php
      - .github/workflows/dashboard-update-notice.yml
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v5
      - name: Preparar DOM para a verificação estrutural
        run: |
          if ! php -r 'exit(extension_loaded("dom") ? 0 : 1);'; then
            apt-get update
            apt-get install -y --no-install-recommends libxml2-dev
            docker-php-ext-install dom
          fi
      - name: Validar sintaxe e avisos sintéticos sem banco ou rede
        run: |
          php -v
          php -l application/helpers/misc_helper.php
          php -l tests/dashboard_update_notice.php
          php tests/dashboard_update_notice.php
