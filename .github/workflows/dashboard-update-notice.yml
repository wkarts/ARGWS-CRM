name: Aviso de atualização do painel
on:
  pull_request:
    branches: [main, develop, feat/banco-brasil-billing-cnab240]
    paths:
      - application/helpers/misc_helper.php
      - application/vendor/ezyang/htmlpurifier/**
      - tests/dashboard_update_notice.php
      - .github/workflows/dashboard-update-notice.yml
  push:
    branches: [main, develop]
    paths:
      - application/helpers/misc_helper.php
      - application/vendor/ezyang/htmlpurifier/**
      - tests/dashboard_update_notice.php
      - .github/workflows/dashboard-update-notice.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  notice:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
        include:
          - php: '8.1'
            image: ghcr.io/wkarts/argws-crm-ci-php@sha256:c6246e2740c225e7db4f0db2b8ba8657fb72cb9638efdedcfe1a8853fc081a14
          - php: '8.5'
            image: ghcr.io/wkarts/argws-crm-ci-php@sha256:d050af83a621363bdc79e5868f85d7203e8b5fb03be6cd37fbb7c41500894677
    container:
      image: ${{ matrix.image }}
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v5
      - name: Conferir ferramentas e DOM da base fixada
        run: |
          EXPECTED_PHP=${{ matrix.php }} argws-ci-smoke
          php -r 'if (!extension_loaded("dom")) throw new RuntimeException("DOM required");'
      - name: Validar sintaxe e avisos sintéticos sem banco ou rede
        run: |
          php -v
          php -l application/helpers/misc_helper.php
          php -l tests/dashboard_update_notice.php
          php tests/dashboard_update_notice.php
