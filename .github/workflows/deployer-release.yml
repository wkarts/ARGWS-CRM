name: ARGWS CRM Deployer - binários e releases
on:
  pull_request:
    branches: [main, develop]
    paths: [deploy/**, tools/argws-crm-deployer/**, .github/workflows/deployer-release.yml]
  push:
    branches: [develop]
    paths: [deploy/**, scripts/package-deploy.py, scripts/apply-release-version.py, tools/argws-crm-deployer/**, .github/workflows/deployer-release.yml]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag SemVer de uma release publicada a reconstruir (ex.: v3.5.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: argws-crm-deployer-assets
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - run: cargo test --manifest-path tools/argws-crm-deployer/Cargo.toml
  build:
    needs: validate
    if: >-
      always() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/develop'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: win-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
          - asset: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Materializar a versão SemVer no deployer
        if: (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Informe uma tag publicada no formato vX.Y.Z." >&2
            exit 1
          }
          python3 scripts/apply-release-version.py "${RELEASE_TAG#v}"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          target: ${{ matrix.target }}
      - name: Instalar linker musl
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Testar e compilar para Windows x64
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = 'tools/argws-crm-deployer/Cargo.toml'
          cargo +1.90.0 test --target $env:TARGET --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo +1.90.0 build --release --target $env:TARGET --manifest-path $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 build failed' }
          $exe = Resolve-Path 'tools/argws-crm-deployer/target/x86_64-pc-windows-msvc/release/argws-crm-deployer.exe'
          $out = Join-Path $env:RUNNER_TEMP 'argws-crm-deployer-smoke'
          & $exe generate --environment production --version (Get-Content VERSION -Raw).Trim() --database mariadb --output $out
          if ($LASTEXITCODE -ne 0) { throw 'Generate smoke test failed' }
          & $exe validate --directory $out
          if ($LASTEXITCODE -ne 0) { throw 'Validate smoke test failed' }
          $stage = Join-Path $env:RUNNER_TEMP 'argws-crm-deployer-assets'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item 'tools/argws-crm-deployer/target/x86_64-pc-windows-msvc/release/argws-crm-deployer.exe' (Join-Path $stage 'argws-crm-deployer-win-x64.exe')
      - name: Testar e compilar para Linux x64
        if: matrix.os == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          manifest=tools/argws-crm-deployer/Cargo.toml
          cargo test --target "$TARGET" --manifest-path "$manifest"
          cargo build --release --target "$TARGET" --manifest-path "$manifest"
          exe="tools/argws-crm-deployer/target/$TARGET/release/argws-crm-deployer"
          out="$RUNNER_TEMP/argws-crm-deployer-smoke"
          "$exe" generate --environment production --version "$(tr -d '[:space:]' < VERSION)" --database mariadb --output "$out"
          "$exe" validate --directory "$out"
          mkdir -p "$RUNNER_TEMP/argws-crm-deployer-assets"
          cp "$exe" "$RUNNER_TEMP/argws-crm-deployer-assets/argws-crm-deployer-linux-x64"
          chmod 0755 "$RUNNER_TEMP/argws-crm-deployer-assets/argws-crm-deployer-linux-x64"
      - name: Publicar artefato do alvo
        uses: actions/upload-artifact@v4
        with:
          name: argws-crm-deployer-${{ matrix.asset }}
          path: ${{ runner.temp }}/argws-crm-deployer-assets/*
          if-no-files-found: error
          retention-days: 1
  prepare-assets:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: argws-crm-deployer-*
          path: release-assets
          merge-multiple: true
      - name: Gerar ZIP separado do diretório deploy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG:-$REQUESTED_TAG}"
          if [[ -z "$release_tag" && "$EVENT_REF" == "refs/heads/develop" ]]; then
            release_tag="argws-crm-develop"
          fi
          if [[ "$release_tag" == "argws-crm-develop" ]]; then
            python3 scripts/package-deploy.py --develop --output-dir release-assets
            deploy_package="ARGWS-CRM-deploy-develop.zip"
            product_version="$(tr -d '[:space:]' < VERSION)"
          else
            [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "Tag inválida; esperado vX.Y.Z ou argws-crm-develop." >&2
              exit 1
            }
            product_version="${release_tag#v}"
            python3 scripts/apply-release-version.py "$product_version"
            python3 scripts/package-deploy.py --version "$product_version" --output-dir release-assets
            deploy_package="ARGWS-CRM-deploy-$product_version.zip"
          fi
          {
            echo "PUBLISH_TAG=$release_tag"
            echo "DEPLOY_PACKAGE=$deploy_package"
            echo "PRODUCT_VERSION=$product_version"
            echo "SOURCE_REVISION=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: Criar checksums e manifesto
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/argws-crm-deployer-win-x64.exe
          test -s release-assets/argws-crm-deployer-linux-x64
          test -s "release-assets/$DEPLOY_PACKAGE"
          chmod 0755 release-assets/argws-crm-deployer-linux-x64
          (
            cd release-assets
            sha256sum argws-crm-deployer-win-x64.exe argws-crm-deployer-linux-x64 "$DEPLOY_PACKAGE" > SHA256SUMS-Deployment.txt
          )
          python3 - <<'PY'
          import json, os
          payload = {
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "productVersion": os.environ["PRODUCT_VERSION"],
              "releaseTag": os.environ["PUBLISH_TAG"],
              "runtime": "rust-native",
              "deploymentKit": {"file": os.environ["DEPLOY_PACKAGE"], "contents": "deploy/**"},
              "binaries": [
                  {"target": "x86_64-pc-windows-msvc", "file": "argws-crm-deployer-win-x64.exe"},
                  {"target": "x86_64-unknown-linux-musl", "file": "argws-crm-deployer-linux-x64"},
              ],
          }
          with open("release-assets/argws-crm-deployer-release.json", "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2)
              stream.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: argws-crm-deployer-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: prepare-assets
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: argws-crm-deployer-release-assets
          path: release-assets
      - name: Escolher o canal e publicar os assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.event.release.tag_name || '' }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" == "refs/heads/develop" ]]; then
            tag="argws-crm-develop"
            develop=true
          elif [[ "$EVENT_NAME" == "release" && "$EVENT_TAG" == "argws-crm-develop" ]]; then
            tag="argws-crm-develop"
            develop=true
          elif [[ "$EVENT_NAME" == "release" ]]; then
            tag="$EVENT_TAG"
            develop=false
          elif [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            develop=false
          elif [[ "$EVENT_REF" == "refs/heads/develop" ]]; then
            tag="argws-crm-develop"
            develop=true
          else
            tag="$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName,isPrerelease,isDraft |
              jq -r '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | map(.tagName) | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last // empty')"
            if [[ -z "$tag" ]]; then
              echo "Nenhuma release SemVer estável foi encontrada." >&2
              exit 1
            fi
            develop=false
          fi
          if [[ "$develop" == true ]]; then
            if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" release-assets/argws-crm-deployer-win-x64.exe release-assets/argws-crm-deployer-linux-x64 release-assets/ARGWS-CRM-deploy-*.zip release-assets/SHA256SUMS-Deployment.txt release-assets/argws-crm-deployer-release.json --repo "$REPOSITORY" --clobber
            else
              gh release create "$tag" release-assets/argws-crm-deployer-win-x64.exe release-assets/argws-crm-deployer-linux-x64 release-assets/ARGWS-CRM-deploy-*.zip release-assets/SHA256SUMS-Deployment.txt release-assets/argws-crm-deployer-release.json --repo "$REPOSITORY" --target "$GITHUB_SHA" --title "ARGWS CRM Deployer develop" --notes "ZIP de implantação, deployer para Windows x64 e Linux x64, checksums e manifesto anexos." --prerelease
            fi
          else
            gh release upload "$tag" release-assets/argws-crm-deployer-win-x64.exe release-assets/argws-crm-deployer-linux-x64 release-assets/ARGWS-CRM-deploy-*.zip release-assets/SHA256SUMS-Deployment.txt release-assets/argws-crm-deployer-release.json --repo "$REPOSITORY" --clobber
          fi
