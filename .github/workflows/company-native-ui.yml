name: Interface nativa multiempresa
on:
  pull_request:
    branches: [main, develop]
    paths: ['application/**', 'assets/**', 'tests/company_*', 'tests/helpers/**', '.github/workflows/company-native-ui.yml']
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wkarts/argws-crm-ci-php@sha256:c6246e2740c225e7db4f0db2b8ba8657fb72cb9638efdedcfe1a8853fc081a14
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v5
      - name: Verificar ferramentas incorporadas
        run: |
          php -r 'foreach (["pdo_sqlite", "mbstring", "dom"] as $extension) { if (!extension_loaded($extension)) { throw new RuntimeException("Missing extension: " . $extension); } }'
          php --version
          node --version
          node -e 'console.log("Playwright " + require("playwright/package.json").version); console.log("Chromium executable: " + require("playwright").chromium.executablePath())'
      - name: Validar rota ativa com o loader nativo real
        run: php tests/support/CompanyShellRouteFixture.php
      - name: Validar inventário operacional e mostrar diferenças
        run: |
          php scripts/company-surface-inventory.php --output /tmp/company-operational-surfaces.json
          php scripts/native-experience-inventory.php > /tmp/native-experience-action-census.json
          diff -u --label a/docs/companies/operational-surfaces.json --label b/docs/companies/operational-surfaces.json docs/companies/operational-surfaces.json /tmp/company-operational-surfaces.json
          diff -u --label a/docs/companies/native-experience-action-census.json --label b/docs/companies/native-experience-action-census.json docs/companies/native-experience-action-census.json /tmp/native-experience-action-census.json
      - name: Preservar inventário gerado para reconciliação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-operational-surfaces-generated
          path: |
            /tmp/company-operational-surfaces.json
            /tmp/native-experience-action-census.json
          if-no-files-found: error
          retention-days: 7
      - name: Sintaxe PHP e contratos estáticos
        run: |
          find application/views/admin/companies application/views/admin/includes application/views/admin/settings application/views/admin/issuers -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l application/controllers/admin/Company_onboarding.php
          php -l application/controllers/admin/Issuers.php
          python3 tests/company_ui_surface_inventory.py
          node --check assets/js/company-workspace.js
          node --check assets/js/company-registry.js
          node --check assets/js/company-shell.js
          node --check assets/js/company-onboarding-modal.js
          node --test tests/company_settings_native.test.cjs tests/company_workspace_driver.test.cjs tests/company_selector_driver.test.cjs tests/native_header_overflow.test.cjs tests/native_sidebar_toggle.test.cjs
          php tests/company_settings_native.php
          php tests/company_settings_layout.php
          php tests/company_shell_presentation.php
          node --test tests/company_shell_controls.test.cjs tests/company_navigation_tabs.test.cjs
          php tests/company_settings_certificate_link.php
      - name: Fluxos desktop/mobile, grid e modal
        env:
          SCREENSHOT_DIR: artifacts/company-native-ui
          COMPANY_SHELL_SCREENSHOT_DIR: artifacts/company-native-ui/fidelity
        run: |
          mkdir -p artifacts/company-native-ui
          node tests/company_shell_browser.cjs
          node tests/company_shell_fidelity.browser.cjs
          node tests/efi/company_ui.browser.cjs
          node tests/company_workspace_browser.cjs
          for attempt in 1 2 3; do node tests/company_registry_modal_browser.cjs; done
          node tests/company_settings_native_browser.cjs
          node tests/company_settings_layout.browser.cjs
      - name: Evidências sintéticas de apresentação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-native-ui
          path: artifacts/company-native-ui
          if-no-files-found: ignore
          retention-days: 1
