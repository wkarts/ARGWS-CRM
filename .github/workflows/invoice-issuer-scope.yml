name: Barreiras de escopo de faturas
on:
  pull_request:
    branches: [main, develop, feat/multi-issuer-foundation, feat/banco-brasil-billing-cnab240]
    paths:
      - application/**
      - modules/**
      - install/database.sql
      - scripts/audit-issuer-isolation.py
      - docs/issuer-isolation-inventory.json
      - tests/invoice_issuer*.php
      - tests/api_issuer_scope.php
      - tests/asaas_payment_writer*.php
      - tests/test_issuer_isolation_inventory.py
      - tests/test_invoice_attachment_storage.py
      - .github/workflows/invoice-issuer-scope.yml
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest tests/test_issuer_isolation_inventory.py tests/test_invoice_attachment_storage.py
      - run: python3 scripts/audit-issuer-isolation.py
      - name: Confirmar que o inventário não libera operação multiemitente
        run: |
          if python3 scripts/audit-issuer-isolation.py --assert-ready; then
            echo 'O gate de operação não pode ser liberado nesta fase.' >&2
            exit 1
          fi
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    container: php:${{ matrix.php }}-cli
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-password
          MYSQL_DATABASE: invoice_scope_tests
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - run: docker-php-ext-install pdo_mysql
      - name: Sintaxe e compatibilidade do calendário legado
        run: |
          php -l application/models/Invoices_model.php
          php -l application/models/Cron_model.php
          php -l application/models/Email_schedule_model.php
          php -l application/controllers/admin/Email_schedule_invoice.php
          php -l application/models/Payments_model.php
          php -l application/models/Reports_model.php
          php -l application/models/Dashboard_model.php
          php -l application/models/Staff_model.php
          php -l application/models/Projects_model.php
          php -l application/services/CustomerProfileBadges.php
          php -l application/models/Clients_model.php
          php -l application/models/Statement_model.php
          php -l application/models/Credit_notes_model.php
          php -l application/controllers/Download.php
          php -l application/controllers/Clients.php
          php -l application/controllers/admin/Reports.php
          php -l application/models/Utilities_model.php
          php -l application/models/Subscriptions_model.php
          php -l application/controllers/Invoice.php
          php -l application/controllers/admin/Invoices.php
          php -l application/controllers/admin/Payments.php
          php -l application/controllers/admin/Misc.php
          php -l application/models/Misc_model.php
          php -l application/libraries/App_bulk_pdf_export.php
          php -l modules/einvoice/src/BulkExporter.php
          php -l modules/exports/services/PaymentCSVExport.php
          php -l modules/exports/services/ExpenseCSVExport.php
          php -l application/helpers/upload_helper.php
          php -l application/helpers/clients_helper.php
          php -l modules/api/models/Api_model.php
          php -l modules/api/controllers/Invoices.php
          php -l application/helpers/invoices_helper.php
          php -l application/services/InvoicePaymentWriter.php
          php -l application/services/InvoiceIssuerScope.php
          php -l application/migrations/384_version_384.php
          find tests -name 'invoice_issuer*.php' -exec php -l '{}' \;
          php tests/recurring_invoice_dates.php
          php tests/recurring_invoice_cron.php
          php tests/recurring_invoice_schema.php
      - name: Executar core real e schema em MySQL isolado
        env:
          ISSUERS_TEST_DSN: mysql:host=mysql;dbname=invoice_scope_tests;charset=utf8mb4
          ISSUERS_TEST_USER: root
          ISSUERS_TEST_PASSWORD: synthetic-test-password
        run: |
          php tests/invoice_issuer_schema.php
          php tests/invoice_issuer_upgrade.php
          php tests/invoice_issuer_scope.php
          php tests/invoice_issuer_recurring_lock.php
          php tests/invoice_issuer_cron.php
          php tests/invoice_issuer_cron_queue.php
          php tests/invoice_issuer_schedule.php
          php tests/invoice_issuer_maintenance.php
          php tests/invoice_issuer_reports.php
          php tests/invoice_issuer_http_files.php
          php tests/invoice_issuer_statement.php
          php tests/invoice_issuer_discovery.php
          php tests/invoice_issuer_exports.php
          php tests/api_issuer_scope.php
          php tests/asaas_payment_writer.php
          php tests/asaas_payment_writer_entrypoints.php
