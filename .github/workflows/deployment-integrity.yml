name: Integridade das stacks ARGWS CRM
on:
  pull_request:
    branches: [main, develop]
    paths: [deploy/**, tools/argws-crm-deployer/**, scripts/package-release.py, scripts/cleanup_actions_cache.py, tests/test_package_release.py, tests/test_actions_cache_cleanup.py, Dockerfile, .github/workflows/actions-cache-retention.yml, .github/workflows/deployer-release.yml]
  push:
    branches: [develop, main]
    paths: [deploy/**, tools/argws-crm-deployer/**, scripts/package-release.py, scripts/cleanup_actions_cache.py, tests/test_package_release.py, tests/test_actions_cache_cleanup.py, Dockerfile, .github/workflows/actions-cache-retention.yml, .github/workflows/deployer-release.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar sintaxe YAML dos workflows
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts path }' .github/workflows/*.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Testar exclusão dos artefatos operacionais dos ZIPs
        run: python3 -m unittest tests/test_package_release.py
      - name: Testar política segura de cache Actions
        run: python3 -m unittest tests/test_actions_cache_cleanup.py
      - name: Testar deployer Rust
        run: cargo test --manifest-path tools/argws-crm-deployer/Cargo.toml
      - name: Gerar as stacks e validar Compose
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/argws-crm-deployer"
          cargo run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- generate --environment develop --output "$out/develop"
          cargo run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- validate --directory "$out/develop"
          cargo run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- generate --environment production --version "$(tr -d '[:space:]' < VERSION)" --database mariadb --output "$out/production"
          cargo run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- validate --directory "$out/production"
          docker compose --env-file "$out/develop/.env" -f "$out/develop/compose.yaml" config --quiet
          docker compose --env-file "$out/production/.env" -f "$out/production/compose.yaml" config --quiet
          docker compose --env-file deploy/develop/.env.example -f deploy/develop/compose.yaml config --quiet
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config --quiet
