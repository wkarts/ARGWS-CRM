name: Integridade das stacks ARGWS CRM
on:
  pull_request:
    branches: [main, develop, feat/banco-brasil-billing-cnab240]
    paths: [deploy/**, tools/argws-crm-deployer/**, scripts/package-release.py, scripts/package-deploy.py, scripts/apply-release-version.py, scripts/cleanup_actions_cache.py, tests/test_package_release.py, tests/test_package_deploy.py, tests/test_release_version.py, tests/test_deployer_release_contract.py, tests/test_actions_cache_cleanup.py, tests/test_docker_provisioning.py, tests/test_issuer_browser_environment.py, tests/docker_provision_smoke.sh, tests/issuers_browser_smoke.cjs, tests/company_context_tabs_browser.cjs, tests/asaas_settings*, tests/company_shell_browser.cjs, tests/company_identity_browser.cjs, tests/company_identity_fixture.php, assets/js/company-identity.js, assets/css/company-identity.css, assets/css/company-shell.css, tests/issuers_standalone_http_smoke.sh, tests/companies/**, tests/companies*.cjs, tests/banco_brasil*.cjs, modules/asaas/**, modules/banco_brasil/**, install/**, application/**, .github/workflows/deployment-integrity.yml, Dockerfile, .dockerignore, docker/**, compose.yaml, .github/workflows/actions-cache-retention.yml, .github/workflows/deployer-release.yml, .github/workflows/release-packages.yml]
  push:
    branches: [develop, main]
    paths: [deploy/**, tools/argws-crm-deployer/**, scripts/package-release.py, scripts/package-deploy.py, scripts/apply-release-version.py, scripts/cleanup_actions_cache.py, tests/test_package_release.py, tests/test_package_deploy.py, tests/test_release_version.py, tests/test_deployer_release_contract.py, tests/test_actions_cache_cleanup.py, tests/test_docker_provisioning.py, tests/test_issuer_browser_environment.py, tests/docker_provision_smoke.sh, tests/issuers_browser_smoke.cjs, tests/company_context_tabs_browser.cjs, tests/asaas_settings*, tests/company_shell_browser.cjs, tests/company_identity_browser.cjs, tests/company_identity_fixture.php, assets/js/company-identity.js, assets/css/company-identity.css, assets/css/company-shell.css, tests/issuers_standalone_http_smoke.sh, tests/companies/**, tests/companies*.cjs, tests/banco_brasil*.cjs, modules/asaas/**, modules/banco_brasil/**, install/**, application/**, .github/workflows/deployment-integrity.yml, Dockerfile, .dockerignore, docker/**, compose.yaml, .github/workflows/actions-cache-retention.yml, .github/workflows/deployer-release.yml, .github/workflows/release-packages.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar sintaxe YAML dos workflows
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts path }' .github/workflows/*.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          rust-src-dir: tools/argws-crm-deployer
      - name: Validar tradução dos modelos HTML
        run: node --test tests/email_templates_ptbr.test.cjs
      - name: Validar contratos das integrações financeiras e SMS
        run: node --test tests/crm_integrations_contract.test.cjs tests/asaas_settings_real_browser.test.cjs tests/companies_asaas_browser.test.cjs
      - name: Validar modelos PT-BR e gatilhos individuais
        run: node --test tests/crm_ptbr_sms_modules.test.cjs
      - name: Testar exclusão dos artefatos operacionais dos ZIPs
        run: python3 -m unittest tests/test_package_release.py
      - name: Testar o ZIP separado do diretório deploy
        run: python3 -m unittest tests/test_package_deploy.py
      - name: Testar contrato do provisionamento Docker
        run: python3 -m unittest tests/test_docker_provisioning.py
      - name: Testar ambiente isolado de cada comando do smoke
        run: python3 -m unittest tests/test_issuer_browser_environment.py
      - name: Preparar navegador para validar o shell nativo
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Testar navegação das abas no shell isolado de Empresas
        run: node tests/company_context_tabs_browser.cjs
      - name: Testar apresentação e confirmação explícita no shell de Empresas
        id: company_shell_browser
        env:
          SCREENSHOT_DIR: /tmp/company-shell-evidence
        run: |
          mkdir -p "$SCREENSHOT_DIR"
          node tests/company_shell_browser.cjs
      - name: Preservar capturas dos fixtures de apresentação de Empresas
        # Retain partial captures after a test failure, but do not collect a skipped test.
        if: always() && (steps.company_shell_browser.outcome == 'success' || steps.company_shell_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: company-shell-synthetic-ui
          path: /tmp/company-shell-evidence
          if-no-files-found: ignore
          retention-days: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Testar cadastro de empresa e consultas sintéticas CNPJ/CEP
        id: company_identity_browser
        env:
          SCREENSHOT_DIR: /tmp/company-identity-evidence
        run: node tests/company_identity_browser.cjs
      - name: Preservar capturas sintéticas do cadastro de empresa
        if: always() && (steps.company_identity_browser.outcome == 'success' || steps.company_identity_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: company-identity-presentation
          path: /tmp/company-identity-evidence
          if-no-files-found: warn
          retention-days: 1
      - name: Testar cadastro PF/PJ e consultas revisadas de clientes
        id: client_identity_browser
        env:
          SCREENSHOT_DIR: /tmp/client-identity-evidence
        run: node tests/companies/client_identity_browser.cjs
      - name: Preservar capturas sintéticas do cadastro de clientes
        if: always() && (steps.client_identity_browser.outcome == 'success' || steps.client_identity_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: client-identity-presentation
          path: /tmp/client-identity-evidence
          if-no-files-found: error
          retention-days: 1
      - name: Testar abas nativas e perfis de ambientes Asaas
        id: asaas_settings_browser
        env:
          ASAAS_UI_ARTIFACTS: /tmp/asaas-settings-evidence
        run: node tests/asaas_settings_tabs.browser.cjs
      - name: Preservar capturas sintéticas das abas Asaas
        if: always() && (steps.asaas_settings_browser.outcome == 'success' || steps.asaas_settings_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: asaas-native-settings-presentation
          path: /tmp/asaas-settings-evidence
          if-no-files-found: error
          retention-days: 1
      - name: Provisionar schema e primeiro administrador em MySQL limpo
        id: issuer_browser
        env:
          ARGWS_ISSUER_BROWSER_SMOKE: '1'
        run: bash tests/docker_provision_smoke.sh
      - name: Preservar evidências visuais sintéticas
        if: always() && (steps.issuer_browser.outcome == 'success' || steps.issuer_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: issuer-native-browser
          path: /tmp/issuer-browser-evidence
          if-no-files-found: ignore
          retention-days: 1
      - name: Testar política segura de cache Actions
        run: python3 -m unittest tests/test_actions_cache_cleanup.py
      - name: Testar contrato dos assets na mesma release
        run: python3 -m unittest tests/test_deployer_release_contract.py
      - name: Testar deployer Rust
        run: cargo +1.90.0 test --manifest-path tools/argws-crm-deployer/Cargo.toml
      - name: Gerar as stacks e validar Compose
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/argws-crm-deployer"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- generate --environment develop --output "$out/develop"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- validate --directory "$out/develop"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- generate --environment production --version "$(tr -d '[:space:]' < VERSION)" --database mariadb --output "$out/production"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- validate --directory "$out/production"
          docker compose --env-file "$out/develop/.env" -f "$out/develop/compose.yaml" config --quiet
          docker compose --env-file "$out/production/.env" -f "$out/production/compose.yaml" config --quiet
          docker compose --env-file deploy/develop/.env.example -f deploy/develop/compose.yaml config --quiet
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config --quiet
          ARGWS_DB_HOST=database.example.invalid ARGWS_DB_NAME=argws_crm ARGWS_DB_USER=argws_crm ARGWS_DB_PASSWORD=ci-test-password docker compose --env-file "$out/production/.env" -f compose.yaml config --quiet
          docker compose --env-file "$out/production/.env" -f compose.yaml config --quiet
