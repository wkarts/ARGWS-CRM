name: Integridade das stacks ARGWS CRM
on:
  pull_request:
    branches: [main, develop, feat/banco-brasil-billing-cnab240]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validation-gate:
    name: Preflight and exact-tree evidence
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_WORKFLOW_PATH: .github/workflows/deployment-integrity.yml
        run: python3 scripts/ci/validation-gate.py
  prepare:
    if: ${{ needs.validation-gate.outputs.run == 'true' }}
    needs: validation-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validar sintaxe YAML dos workflows
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path, aliases: true); puts path }' .github/workflows/*.yml
      - name: Conferir cobertura completa dos grupos isolados
        run: python3 scripts/ci/standalone-browser-plan.py --check
      - name: Validar ordem dos preflights e isolamento das ferramentas
        run: node --test tests/ci_preflight_order.test.cjs tests/native_company/mail_queue_form.test.cjs tests/persisted_invoice_target.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar prova do responsável no fixture de upgrade
        run: node --test tests/installed_master_proof.test.cjs
      - name: Validar tradução dos modelos HTML
        run: node --test tests/email_templates_ptbr.test.cjs
      - name: Validar contratos das integrações financeiras e SMS
        run: node --test tests/crm_integrations_contract.test.cjs tests/asaas_settings_real_browser.test.cjs tests/companies_asaas_browser.test.cjs
      - name: Validar contrato dos assets nativos e guards Asaas
        run: node --test tests/asaas_preferences_real_browser.test.cjs
      - name: Validar modelos PT-BR e gatilhos individuais
        run: node --test tests/crm_ptbr_sms_modules.test.cjs
      - name: Testar exclusão dos artefatos operacionais dos ZIPs
        run: python3 -m unittest tests/test_package_release.py
      - name: Testar o ZIP separado do diretório deploy
        run: python3 -m unittest tests/test_package_deploy.py
      - name: Testar contrato do provisionamento Docker
        run: python3 -m unittest tests/test_docker_provisioning.py
      - name: Testar ambiente isolado de cada comando do smoke
        run: python3 -m unittest tests/test_issuer_browser_environment.py
      - name: Testar política segura de cache Actions
        run: python3 -m unittest tests/test_actions_cache_cleanup.py
      - name: Testar contrato dos assets na mesma release
        run: python3 -m unittest tests/test_deployer_release_contract.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Validar auditoria do responsável antes do smoke longo
        run: php tests/installed_master_proof.php
      - name: Validar isolamento do número no POST legado antes do smoke longo
        run: |
          php tests/legacy_invoice_number_scope.php
          php tests/legacy_invoice_pdf_format.php
          php tests/native_api_router.php
          php tests/native_mail_callback_denial.php
          php tests/native_invoice_source_route.php
      - name: Validar ownership transacional do checkout Asaas antes do smoke longo
        run: php tests/asaas_checkout_transaction_tables.php
      - name: Reutilizar somente binários do navegador pareados ao lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/ci/package-lock.json') }}
      - name: Preparar navegador para validar o shell nativo
        timeout-minutes: 6
        run: |
          bash scripts/ci/prepare-apt-mirrors.sh
          mkdir -p "$RUNNER_TEMP/ci-browser"
          cp docker/ci/package.json docker/ci/package-lock.json "$RUNNER_TEMP/ci-browser/"
          npm ci --prefix "$RUNNER_TEMP/ci-browser" --ignore-scripts
          "$RUNNER_TEMP/ci-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/ci-browser/node_modules" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Testar navegação das abas no shell isolado de Empresas
        run: node tests/native_context_tabs_browser.cjs
      - name: Testar apresentação e escolha com POST no shell de Empresas
        id: company_shell_browser
        env:
          SCREENSHOT_DIR: /tmp/company-shell-evidence
        run: |
          mkdir -p "$SCREENSHOT_DIR"
          node tests/native_shell_browser.cjs
      - name: Preservar capturas dos fixtures de apresentação de Empresas
        # Retain partial captures after a test failure, but do not collect a skipped test.
        if: always() && (steps.company_shell_browser.outcome == 'success' || steps.company_shell_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: company-shell-synthetic-ui
          path: /tmp/company-shell-evidence
          if-no-files-found: ignore
          retention-days: 1
      - name: Testar cadastro de empresa e consultas sintéticas CNPJ/CEP
        id: company_identity_browser
        env:
          SCREENSHOT_DIR: /tmp/company-identity-evidence
        run: node tests/native_identity_browser.cjs
      - name: Preservar capturas sintéticas do cadastro de empresa
        if: always() && (steps.company_identity_browser.outcome == 'success' || steps.company_identity_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: company-identity-presentation
          path: /tmp/company-identity-evidence
          if-no-files-found: warn
          retention-days: 1
      - name: Testar cadastro PF/PJ e consultas revisadas de clientes
        id: client_identity_browser
        env:
          SCREENSHOT_DIR: /tmp/client-identity-evidence
        run: node tests/companies/client_identity_browser.cjs
      - name: Preservar capturas sintéticas do cadastro de clientes
        if: always() && (steps.client_identity_browser.outcome == 'success' || steps.client_identity_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: client-identity-presentation
          path: /tmp/client-identity-evidence
          if-no-files-found: error
          retention-days: 1
      - name: Testar abas nativas e perfis de ambientes Asaas
        id: asaas_settings_browser
        env:
          ASAAS_UI_ARTIFACTS: /tmp/asaas-settings-evidence
        run: |
          node tests/asaas_native_scroll.browser.cjs
          node tests/asaas_settings_tabs.browser.cjs
          node tests/asaas_operations_panel.browser.cjs
      - name: Preservar capturas sintéticas das abas Asaas
        if: always() && (steps.asaas_settings_browser.outcome == 'success' || steps.asaas_settings_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: asaas-native-settings-presentation
          path: /tmp/asaas-settings-evidence
          if-no-files-found: error
          retention-days: 1
      - uses: docker/setup-buildx-action@v3
      - name: Identificar árvore exata da imagem de smoke
        id: smoke_tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Construir imagem de smoke com cache de camadas
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: argws-crm-provision-smoke:ci
          build-args: ARGWS_VERSION=ci
          labels: org.argws.smoke.source-tree=${{ steps.smoke_tree.outputs.tree }}
          cache-from: type=gha,scope=crm-provision-smoke
          cache-to: type=gha,mode=max,scope=crm-provision-smoke
      - name: Exportar a imagem desta árvore para os grupos isolados
        run: docker save argws-crm-provision-smoke:ci -o "$RUNNER_TEMP/crm-smoke-image.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: crm-smoke-image-${{ github.sha }}
          path: ${{ runner.temp }}/crm-smoke-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  http:
    # Tooling finishes first so eleven isolated HTTP workers still fit the
    # twenty-runner long-phase budget alongside the unchanged SQL coverage.
    needs: [validation-gate, prepare, tooling]
    if: ${{ needs.validation-gate.outputs.run == 'true' && needs.prepare.result == 'success' && needs.tooling.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [tasks-domains, support, timers-a, timers-b, timers-primary, projects, expenses, sales-pdf, settings, providers, banking]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: crm-smoke-image-${{ github.sha }}
          path: ${{ runner.temp }}/smoke-image
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Carregar imagem previamente construída e identificada
        run: docker load -i "$RUNNER_TEMP/smoke-image/crm-smoke-image.tar"
      - name: Reutilizar binários do navegador pareados ao lockfile
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/ci/package-lock.json') }}
      - name: Preparar navegador com o lockfile dedicado
        timeout-minutes: 6
        run: |
          bash scripts/ci/prepare-apt-mirrors.sh
          mkdir -p "$RUNNER_TEMP/ci-browser"
          cp docker/ci/package.json docker/ci/package-lock.json "$RUNNER_TEMP/ci-browser/"
          npm ci --prefix "$RUNNER_TEMP/ci-browser" --ignore-scripts
          "$RUNNER_TEMP/ci-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/ci-browser/node_modules" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Provisionar schema e primeiro administrador em MySQL limpo
        id: issuer_browser
        env:
          ARGWS_ISSUER_BROWSER_SMOKE: '1'
          ARGWS_BROWSER_GROUP: ${{ matrix.group }}
          ARGWS_SMOKE_PREBUILT_IMAGE: '1'
        run: bash tests/docker_provision_smoke.sh
      - name: Preservar evidências visuais sintéticas
        if: always() && (steps.issuer_browser.outcome == 'success' || steps.issuer_browser.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: issuer-native-browser-${{ matrix.group }}
          path: /tmp/issuer-browser-evidence
          if-no-files-found: ignore
          retention-days: 1
  tooling:
    needs: [validation-gate, prepare]
    if: ${{ needs.validation-gate.outputs.run == 'true' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          rust-src-dir: tools/argws-crm-deployer
      - name: Reutilizar compilação e downloads Rust sem reutilizar resultados de testes
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/argws-crm-deployer/target
          key: rust-${{ runner.os }}-1.90.0-${{ hashFiles('tools/argws-crm-deployer/Cargo.lock') }}
      - name: Testar deployer Rust
        run: cargo +1.90.0 test --manifest-path tools/argws-crm-deployer/Cargo.toml
      - name: Gerar as stacks e validar Compose
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/argws-crm-deployer"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- generate --environment develop --output "$out/develop"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- validate --directory "$out/develop"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- generate --environment production --version "$(tr -d '[:space:]' < VERSION)" --database mariadb --output "$out/production"
          cargo +1.90.0 run --quiet --manifest-path tools/argws-crm-deployer/Cargo.toml -- validate --directory "$out/production"
          docker compose --env-file "$out/develop/.env" -f "$out/develop/compose.yaml" config --quiet
          docker compose --env-file "$out/production/.env" -f "$out/production/compose.yaml" config --quiet
          docker compose --env-file deploy/develop/.env.example -f deploy/develop/compose.yaml config --quiet
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config --quiet
          ARGWS_DB_HOST=database.example.invalid ARGWS_DB_NAME=argws_crm ARGWS_DB_USER=argws_crm ARGWS_DB_PASSWORD=ci-test-password docker compose --env-file "$out/production/.env" -f compose.yaml config --quiet
          docker compose --env-file "$out/production/.env" -f compose.yaml config --quiet
  validate:
    # Retain the existing required check. Cancelled, failed or incomplete groups cannot satisfy it.
    if: always()
    needs: [validation-gate, prepare, http, tooling]
    runs-on: ubuntu-latest
    steps:
      - name: Exigir a rodada completa ou a prova exata já validada
        env:
          GATE: ${{ needs.validation-gate.result }}
          RUN: ${{ needs.validation-gate.outputs.run }}
          PREPARE: ${{ needs.prepare.result }}
          HTTP: ${{ needs.http.result }}
          TOOLING: ${{ needs.tooling.result }}
        run: |
          test "$GATE" = success
          if [ "$RUN" = false ]; then
            test "$PREPARE" = skipped && test "$HTTP" = skipped && test "$TOOLING" = skipped
          else
            test "$RUN" = true
            test "$PREPARE" = success && test "$HTTP" = success && test "$TOOLING" = success
          fi
