name: Origem e remocao segura Asaas
on:
  pull_request:
    branches: [main, develop, fix/asaas-immutable-payment-origin, fix/asaas-callback-hmvc-route, feat/banco-brasil-billing-cnab240]
    paths:
      - modules/asaas/**
      - application/models/Invoices_model.php
      - application/models/Payments_model.php
      - application/models/Credit_notes_model.php
      - application/services/InvoicePaymentWriter.php
      - application/services/CompanyBankReversalSchema.php
      - tests/asaas_*.php
      - tests/companies/asaas_card_*.php
      - tests/browser/asaas_settings.cjs
      - tests/fixtures/asaas_settings_page.php
      - application/views/admin/settings/native_asaas_card.php
      - application/services/NativeCompanySpecializedOperations.php
      - tests/companies/asaas_origin_policy.php
      - tests/companies/asaas_instruments.php
      - tests/companies/asaas_explicit_reconciliation.php
      - tests/asaas_origin_policy_static.py
      - tests/asaas_*.test.js
      - tests/asaas_*.test.cjs
      - docker/ci/**
      - tests/support/AsaasSettingsFixture.cjs
      - .github/workflows/asaas-payment-origin.yml
  push:
    branches: [main, develop, fix/asaas-webhook-scope-auth]
    paths:
      - modules/asaas/**
      - application/models/Invoices_model.php
      - application/models/Payments_model.php
      - application/models/Credit_notes_model.php
      - application/services/InvoicePaymentWriter.php
      - application/services/CompanyBankReversalSchema.php
      - tests/asaas_*.php
      - tests/companies/asaas_card_*.php
      - tests/browser/asaas_settings.cjs
      - tests/fixtures/asaas_settings_page.php
      - application/views/admin/settings/native_asaas_card.php
      - application/services/NativeCompanySpecializedOperations.php
      - tests/companies/asaas_origin_policy.php
      - tests/companies/asaas_instruments.php
      - tests/companies/asaas_explicit_reconciliation.php
      - tests/asaas_origin_policy_static.py
      - tests/asaas_*.test.js
      - tests/asaas_*.test.cjs
      - docker/ci/**
      - tests/support/AsaasSettingsFixture.cjs
      - .github/workflows/asaas-payment-origin.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
        include:
          - php: '8.1'
            image: ghcr.io/wkarts/argws-crm-ci-php@sha256:c6246e2740c225e7db4f0db2b8ba8657fb72cb9638efdedcfe1a8853fc081a14
          - php: '8.5'
            image: ghcr.io/wkarts/argws-crm-ci-php@sha256:d050af83a621363bdc79e5868f85d7203e8b5fb03be6cd37fbb7c41500894677
    container:
      image: ${{ matrix.image }}
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v5
      - run: EXPECTED_PHP=${{ matrix.php }} argws-ci-smoke
      - name: Validar sintaxe
        run: |
          php -v
          find modules/asaas -path '*/vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l application/models/Invoices_model.php
          php -l application/models/Payments_model.php
          php -l application/models/Credit_notes_model.php
          php -l application/services/InvoicePaymentWriter.php
          find tests -name 'asaas_*.php' -print0 | xargs -0 -n1 php -l
      - name: Testar fluxo sem rede e sem credenciais
        run: |
          php tests/asaas_invoice_payment_removal.php
          php tests/asaas_payment_origin_integration.php
          php tests/asaas_webhook_security.php
          php tests/asaas_webhook_route.php
          php tests/asaas_callback_route.php
          php tests/asaas_callback_version.php
          php tests/asaas_installment_transport.php
          php tests/asaas_sdk_reference.php
          php tests/asaas_card_pricing_reference.php
          php tests/asaas_webhook_admin.php
          php tests/asaas_remote_webhook.php
          php tests/asaas_hosted_card.php
          php tests/asaas_hosted_card_gateway.php
          php tests/asaas_customer_contact_policy.php
          php tests/asaas_company_instruments.php
          php tests/asaas_mutation_no_retry.php
          php tests/asaas_sdk_030.php
          php tests/asaas_account_report_contract.php
          php tests/asaas_pix_authorization_contract.php
          php tests/asaas_pix_recovery.php
          php tests/asaas_settings_policy.php
          php tests/asaas_environment_profiles.php
          php tests/asaas_settings_presentation.php
          php tests/asaas_webhook_tokens.php
          php tests/asaas_payment_writer.php
          php tests/asaas_payment_writer_entrypoints.php
  mysql:
    runs-on: ubuntu-latest
    container: php:8.3-cli
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: asaas_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Habilitar driver de teste
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev
          docker-php-ext-configure gd --with-freetype --with-jpeg
          docker-php-ext-install -j"$(nproc)" pdo_mysql mbstring gd
      - name: Validar persistencia e constraints no MySQL descartavel
        env:
          ASAAS_TEST_MYSQL_DSN: mysql:host=mysql;dbname=asaas_test;charset=utf8mb4
          ASAAS_TEST_MYSQL_USER: root
          ASAAS_TEST_MYSQL_PASSWORD: test-only-password
          ISSUERS_TEST_DSN: mysql:host=mysql;dbname=asaas_test;charset=utf8mb4
          ISSUERS_TEST_USER: root
          ISSUERS_TEST_PASSWORD: test-only-password
        run: |
          php tests/asaas_payment_origin_schema.php
          php tests/asaas_webhook_schema.php
          php tests/asaas_webhook_token_schema.php
          php tests/asaas_module_migration_154.php
          php tests/asaas_module_migration_155.php
          php tests/asaas_module_migrations.php
          php tests/asaas_callback_migration.php
          php tests/asaas_payment_writer_mysql.php
          php tests/companies/asaas_origin_policy.php
          php tests/companies/asaas_instruments.php
          php tests/companies/asaas_explicit_reconciliation.php
          php tests/companies/asaas_inflight_quarantine.php
          php tests/companies/asaas_card_api_contract.php
          php tests/companies/asaas_card_pricing.php
          php tests/companies/asaas_card_pricing_controller.php
          php tests/companies/asaas_card_pricing_concurrency.php
          php tests/companies/asaas_monitor.php
          php tests/companies/asaas_remote_monitor.php
          php tests/companies/asaas_payment_report.php
          php tests/companies/asaas_automatic_pix_monitor.php
          php tests/companies/asaas_pix_inbox.php
          php tests/companies/asaas_pix_reservations.php
          php tests/companies/asaas_pix_recovery.php
          php tests/companies/asaas_pix_consent.php
          php tests/companies/asaas_pix_portal_controller.php
          php tests/companies/asaas_pix_initial_receipt.php
          php tests/companies/asaas_pix_portal_enrollment.php
          php tests/companies/asaas_pix_receipt_jobs.php
          php tests/companies/asaas_pix_inbox_controller.php
          php tests/companies/asaas_account_reports.php
          php tests/companies/asaas_batch_concurrency.php
          php tests/companies/asaas_legacy_binding_concurrency.php
          php tests/companies/asaas_legacy_binding_controller.php
          php tests/companies/asaas_legacy_successors.php
          php tests/companies/asaas_legacy_primary_scope.php
          php tests/companies/asaas_installment_receipts.php
          php tests/companies/asaas_installment_refunds.php
          php tests/companies/asaas_installment_removal.php
          php tests/companies/asaas_installment_batch_removal.php
          php tests/companies/asaas_card_payments_concurrency.php

  settings-ui:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wkarts/argws-crm-ci-php@sha256:c6246e2740c225e7db4f0db2b8ba8657fb72cb9638efdedcfe1a8853fc081a14
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@v5
      - name: Validar abas em JavaScript e DOM Chromium pareado
        run: |
          node --test tests/asaas_batch_queue.test.cjs
          node --test tests/asaas_settings_browser_runtime.test.cjs
          node --test tests/asaas_settings_dom_harness.test.cjs
          node --check modules/asaas/assets/js/settings-tabs.js
          node --check assets/js/native-asaas-settings.js
          php tests/companies/asaas_card_payment_controller.php
          node tests/browser/asaas_settings.cjs
          node tests/browser/asaas_installments.cjs
          node tests/browser/asaas_payment_report.cjs
          node tests/browser/asaas_automatic_pix.cjs
          node tests/browser/asaas_account_reports.cjs
          node --check tests/companies/asaas_preferences_real_browser.cjs
          node --test tests/asaas_preferences_real_browser.test.cjs
          chrome="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -n "$chrome" && test -x "$chrome"
          node --version
          node -e 'console.log("Playwright " + require("playwright/package.json").version)'
          printf 'Chromium executable: %s\n' "$chrome"
          timeout 10s "$chrome" --version
          CHROMIUM_BIN="$chrome" ASAAS_UI_SCREENSHOT=artifacts/asaas-settings.png node tests/asaas_settings_tabs.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: asaas-settings-synthetic
          path: artifacts/asaas-settings.png
          if-no-files-found: error
