name: GHCR develop-beta
on:
  pull_request:
    branches: [develop-beta]
  push:
    branches: [develop-beta]
permissions:
  contents: read
concurrency:
  group: beta-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/wkarts/argws-crm-ci-php@sha256:c6246e2740c225e7db4f0db2b8ba8657fb72cb9638efdedcfe1a8853fc081a14
      options: --shm-size=1g
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Versão canônica e regressões
        run: |
          bash scripts/check-release-version.sh
          python3 -m unittest tests/test_release_version.py tests/test_package_release.py tests/test_beta_container.py
          php tests/native_migration_tracking.php
          php tests/brand_assets_smoke.php
          php tests/crm_ui_branding.php
          node --test tests/native_pwa.test.cjs
          python3 tests/test_native_pwa_http.py
          node tests/native_pwa_navigation.browser.cjs
          node tests/native_pwa.browser.cjs
      - name: Ler versão já aprovada no código
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Preflight de colisão sem escrita
        if: vars.ARGWS_BETA_PUBLICATION_ENABLED == 'true' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-beta-image.py

  build-pr:
    if: github.event_name == 'pull_request'
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Compilar PR sem autenticação ou publicação
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: argws-beta-test:${{ github.sha }}
          build-args: ARGWS_VERSION=${{ needs.validate.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=argws-beta-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=argws-beta-${{ matrix.arch }}
      - name: Smoke da imagem local, sem inicializar banco
        env:
          BETA_IMAGE: argws-beta-test:${{ github.sha }}
          BETA_VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/smoke-beta-image.sh

  build-push:
    if: vars.ARGWS_BETA_PUBLICATION_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop-beta' && github.repository == 'wkarts/ARGWS-CRM'
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Construir por digest, sem tags de canal/versão
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/wkarts/argws-crm,push-by-digest=true,name-canonical=true,push=true
          build-args: ARGWS_VERSION=${{ needs.validate.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=argws-beta-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=argws-beta-${{ matrix.arch }}
      - name: Smoke do digest construído, sem inicializar banco
        env:
          BETA_IMAGE: ghcr.io/wkarts/argws-crm@${{ steps.build.outputs.digest }}
          BETA_VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/smoke-beta-image.sh
      - name: Registrar somente digest aprovado
        env:
          BETA_DIGEST: ${{ steps.build.outputs.digest }}
          BETA_ARCH: ${{ matrix.arch }}
          BETA_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p /tmp/beta-digests
          python3 - <<'PY'
          import json, os, pathlib
          e = os.environ
          pathlib.Path('/tmp/beta-digests', e['BETA_ARCH']+'.json').write_text(json.dumps({
              'digest': e['BETA_DIGEST'], 'arch': e['BETA_ARCH'],
              'version': e['BETA_VERSION'], 'sha': e['GITHUB_SHA']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: beta-digest-${{ matrix.arch }}
          path: /tmp/beta-digests/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: vars.ARGWS_BETA_PUBLICATION_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/develop-beta' && github.repository == 'wkarts/ARGWS-CRM'
    needs: [validate, build-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-digest-*
          path: /tmp/beta-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Preservar versão existente e promover somente canal beta
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-beta-image.py --publish
