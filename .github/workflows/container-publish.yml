name: Containers ARGWS CRM

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Atualizar tags base/dependência existentes no GHCR
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  packages: write

concurrency:
  group: argws-crm-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar código, contrato e versão
    runs-on: ubuntu-latest
    steps:
      - name: Obter código e tags SemVer
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guardar o canal de publicação
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/develop" ]] || {
            echo "Este workflow só publica o canal develop." >&2
            exit 1
          }

      - name: Validar versão do produto e migration de schema
        run: bash ./scripts/check-release-version.sh

      - name: Executar regressões, política de versão e privacidade
        run: |
          node tests/custom_links_security.test.cjs
          node tests/argws_platform_contract.test.cjs
          node --test tests/email_templates_ptbr.test.cjs
          node tests/crm_ptbr_resources_contract.test.cjs
          python3 -m unittest tests/test_release_version.py tests/test_package_release.py tests/test_package_deploy.py tests/test_docker_provisioning.py

      - name: Sugerir SemVer para promoção develop → main
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\\.[0-9]+\\.[0-9]+$' | sort -V | tail -n 1 || true)"
          baseline="$(tr -d '[:space:]' < VERSION)"
          plan="$(python3 scripts/plan-release-version.py --latest "$latest" --baseline "$baseline" --labels "$PR_LABELS" --title "$PR_TITLE")"
          version="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["version"])' "$plan")"
          bump="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["bump"])' "$plan")"
          {
            echo "### Versão ARGWS CRM sugerida: v$version"
            echo
            echo "Incremento SemVer: **$bump**."
            echo "O merge em main cria a imagem estável, a release e os pacotes; develop permanece no canal :develop."
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-ghcr-dependencies:
    name: Garantir base FrankenPHP e dependências GHCR
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Instalar skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
      - name: Entrar no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Criar imagens ausentes e atualizar somente por solicitação explícita
        env:
          OWNER: ${{ github.repository_owner }}
          REFRESH_EXISTING: ${{ inputs.refresh_dependencies || false }}
        shell: bash
        run: |
          set -euo pipefail
          sync() {
            local source="$1"
            local target="$2"
            if [[ "$REFRESH_EXISTING" != "true" ]] && skopeo inspect "docker://${target}" >/dev/null 2>&1; then
              echo "Preserving existing image: $target"
              return 0
            fi
            skopeo copy --all "docker://$source" "docker://$target"
          }
          sync docker.io/dunglas/frankenphp:1-php8.3-bookworm ghcr.io/${OWNER}/argws-crm-base:1-php8.3-bookworm
          sync docker.io/library/mysql:8.0 ghcr.io/${OWNER}/argws-crm-mysql:8.0
          sync docker.io/library/mariadb:11.4 ghcr.io/${OWNER}/argws-crm-mariadb:11.4

  validate-frankenphp:
    name: Compilar FrankenPHP sem publicar (pull request)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ler versão SemVer para o container
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Validar imagem para linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            ARGWS_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=argws-crm-pr
          labels: |
            org.opencontainers.image.title=ARGWS CRM
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

  build-develop:
    name: Gerar develop ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    needs: [validate, prepare-ghcr-dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Obter commit exato de develop
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Ler versão SemVer para o container
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Acessar GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build da imagem de desenvolvimento por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/wkarts/argws-crm,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ARGWS_VERSION=${{ steps.version.outputs.value }}
            ARGWS_FRANKENPHP_IMAGE=ghcr.io/wkarts/argws-crm-base:1-php8.3-bookworm
          labels: |
            org.opencontainers.image.title=ARGWS CRM
            org.opencontainers.image.version=develop
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=argws-crm-develop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=argws-crm-develop-${{ matrix.arch }}
      - name: Exportar digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Guardar digest da arquitetura
        uses: actions/upload-artifact@v4
        with:
          name: digest-development-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-develop:
    name: Publicar manifesto multi arquitetura :develop
    if: github.event_name != 'pull_request'
    needs: build-develop
    runs-on: ubuntu-latest
    steps:
      - name: Reunir digests amd64 e arm64
        uses: actions/download-artifact@v4
        with:
          pattern: digest-development-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Acessar GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Criar e verificar somente a tag develop
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/develop" ]]
          repo="ghcr.io/wkarts/argws-crm"
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("${repo}@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "${repo}:develop" "${sources[@]}"
          docker buildx imagetools inspect "${repo}:develop"
