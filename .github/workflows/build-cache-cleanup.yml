name: Limpeza do cache de build ARGWS CRM
on:
  schedule:
    - cron: '37 */6 * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      apply:
        description: Aplicar exclusões somente quando não houver outro workflow ativo
        type: boolean
        default: false
permissions:
  actions: write
  contents: read
concurrency:
  group: argws-crm-cache-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'wkarts/ARGWS-CRM' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Planejar ou limpar caches enquanto o repositório está ocioso
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.apply == true }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/cache-retention-report.json")
          if [[ "$APPLY_REQUESTED" == true ]]; then args+=(--apply); fi
          python3 scripts/cleanup_actions_cache.py "${args[@]}"
      - name: Guardar relatório de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argws-crm-cache-retention-${{ github.run_id }}
          path: ${{ runner.temp }}/cache-retention-report.json
          if-no-files-found: error
          retention-days: 30
