name: Limpeza do cache de build ARGWS CRM

on:
  schedule:
    - cron: '37 4 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: Aplicar as exclusões do cache identificadas no relatório
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.repository == 'wkarts/argws-crm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Planejar e limpar somente caches de build ARGWS antigos
        uses: actions/github-script@v7
        env:
          APPLY_REQUESTED: ${{ github.event_name == 'schedule' || inputs.apply == true }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            if (context.ref !== 'refs/heads/main' && context.eventName === 'workflow_dispatch') {
              core.setFailed('A limpeza manual só pode ser executada a partir de main.');
              return;
            }
            const caches = await github.paginate(github.rest.actions.getActionsCacheList, { owner, repo, per_page: 100 });
            const activeRefs = new Set();
            for (const status of ['in_progress', 'queued', 'waiting', 'pending', 'requested']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, status, per_page: 100 });
              for (const run of runs) {
                if (run.id !== context.runId && run.head_branch) activeRefs.add(`refs/heads/${run.head_branch}`);
              }
            }
            const cutoff = Date.now() - 48 * 60 * 60 * 1000;
            const candidates = caches.filter(cache => {
              const key = String(cache.key || '').toLowerCase();
              const ref = String(cache.ref || '');
              const crmBuildCache = [
                'argws-crm-buildx',
                'argws-crm-develop-',
                'argws-crm-release-',
              ].some(scope => key.includes(scope));
              return crmBuildCache
                && !ref.startsWith('refs/tags/')
                && !activeRefs.has(ref)
                && new Date(cache.last_accessed_at).getTime() < cutoff;
            }).slice(0, 100);
            const apply = process.env.APPLY_REQUESTED === 'true';
            const report = { mode: apply ? 'apply' : 'dry-run', at: new Date().toISOString(), candidates: [], deleted: [] };
            for (const cache of candidates) {
              const row = { id: cache.id, key: cache.key, ref: cache.ref, last_accessed_at: cache.last_accessed_at, size_in_bytes: cache.size_in_bytes };
              report.candidates.push(row);
              if (apply) {
                await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                report.deleted.push(row);
              }
            }
            fs.writeFileSync('cache-retention-report.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary.addHeading('Retenção de cache de build').addRaw(`Modo: ${report.mode}. Caches identificados: ${report.candidates.length}. Exclusões confirmadas: ${report.deleted.length}. Tags de release e imagens GHCR não são alteradas.`).write();

      - name: Guardar relatório de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: argws-crm-cache-retention-${{ github.run_id }}
          path: cache-retention-report.json
          if-no-files-found: error
          retention-days: 30
