name: Preparar inventários oficiais da integração
on:
  push:
    branches: [fix/crm-post-call-integration]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, dom
      - name: Gerar sem executar o CRM ou acessar banco
        run: |
          mkdir -p artifacts/official-inventories
          php scripts/company-surface-inventory.php --output artifacts/official-inventories/operational-surfaces.json
          python3 scripts/inventory-company-boundaries.py
          cp docs/companies/boundary-inventory.json artifacts/official-inventories/
          git rev-parse HEAD > artifacts/official-inventories/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-call-inventories
          path: artifacts/official-inventories
          if-no-files-found: error
          retention-days: 1
  focused-php:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, dom
      - name: Contratos PHP da integração sem banco externo
        run: |
          php tests/module_maintenance.php
          php tests/ideal_module_migrations.php
          php tests/module_version_column_migration.php
          php tests/issuers_core_upgrade.php
          php tests/company_context.php
          php tests/settings/email_template_localization.php
          php tests/asaas_settings_presentation.php
          php tests/asaas_settings_policy.php
          php tests/company_shell_presentation.php
          php tests/support/CompanyShellRouteFixture.php
