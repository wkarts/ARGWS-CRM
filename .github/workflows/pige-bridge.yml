name: Ponte opcional PIGE
on:
  pull_request:
    branches: [main, develop, feat/banco-brasil-billing-cnab240]
    paths: ['modules/pige_bridge/**', 'application/config/argws_resources.php', 'tests/pige_bridge_*.php', 'tests/pige_bridge_*.py', 'tests/fixtures/pige-crm-diagnostics-v1.json', 'tests/fixtures/pige-crm-v1.json', '.github/workflows/pige-bridge.yml']
  push:
    branches: [main, develop]
    paths: ['modules/pige_bridge/**', 'application/config/argws_resources.php', 'tests/pige_bridge_*.php', 'tests/pige_bridge_*.py', 'tests/fixtures/pige-crm-diagnostics-v1.json', 'tests/fixtures/pige-crm-v1.json', '.github/workflows/pige-bridge.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.5']
    container: php:${{ matrix.php }}-cli
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-test-password
          MYSQL_DATABASE: bridge_test
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pisolated-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - name: Preparar driver MySQL no ambiente descartável
        run: |
          apt-get update && apt-get install -y --no-install-recommends libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev
          docker-php-ext-configure gd --with-freetype --with-jpeg
          docker-php-ext-install pdo_mysql mbstring gd
      - name: Sintaxe e contratos sem chamadas financeiras
        run: |
          find modules/pige_bridge tests -name '*.php' \( -path 'modules/pige_bridge/*' -o -name 'pige_bridge_*.php' \) -print0 | xargs -0 -n1 php -l
          php tests/pige_bridge_migration.php
          php tests/pige_bridge_protocol.php
          php tests/pige_bridge_storage.php
          php tests/pige_bridge_controller.php
          php tests/pige_bridge_disabled.php
          php tests/pige_bridge_diagnostics.php
          php tests/pige_bridge_connections.php
          php tests/pige_bridge_admin.php
          php tests/pige_bridge_invoices.php
          php tests/pige_bridge_charges.php
      - name: Schema e idempotência em MySQL real isolado
        env:
          PIGE_BRIDGE_TEST_DSN: mysql:host=mysql;dbname=bridge_test;charset=utf8mb4
          PIGE_BRIDGE_TEST_USER: root
          PIGE_BRIDGE_TEST_PASSWORD: isolated-test-password
          ISSUERS_TEST_DSN: mysql:host=mysql;dbname=bridge_test;charset=utf8mb4
          ISSUERS_TEST_USER: root
          ISSUERS_TEST_PASSWORD: isolated-test-password
        run: |
          php tests/pige_bridge_mysql.php
          php tests/pige_bridge_connections_mysql.php
          php tests/pige_bridge_invoices_mysql.php
          php tests/pige_bridge_charges_mysql.php
          php tests/pige_bridge_bb_mysql.php
          php tests/banco_brasil_bridge125_mysql.php
