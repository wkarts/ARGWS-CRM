name: PR validation round
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-validation-round-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  monitor:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 48
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate cancellation boundaries
        run: python3 -m unittest tests/test_pr_validation_round.py
      - name: Stop obsolete or failed PR validation rounds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pr-validation-round.py
