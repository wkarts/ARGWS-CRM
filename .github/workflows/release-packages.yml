name: Pacotes ARGWS CRM

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: argws-crm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Obter histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar versão e tag
        run: ./scripts/check-release-version.sh "${GITHUB_REF_NAME}"

      - name: Ler versão SemVer
        id: version
        shell: bash
        run: printf 'value=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Executar testes de regressão
        run: |
          node tests/custom_links_security.test.cjs
          node tests/argws_platform_contract.test.cjs
          python3 -m unittest tests/test_package_release.py

      - name: Preparar diretório-base da versão anterior
        id: base
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | awk -v current="${GITHUB_REF_NAME}" '$0 != current { print; exit }')"
          if [[ -z "$previous_tag" ]]; then
            echo "Não foi encontrada uma tag anterior para gerar o pacote incremental." >&2
            exit 1
          fi
          printf 'tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/argws-crm-base"
          git archive "$previous_tag" | tar -x -C "$RUNNER_TEMP/argws-crm-base"

      - name: Gerar pacote completo, incremental e checksums
        run: |
          python3 scripts/package-release.py \
            --base-dir "$RUNNER_TEMP/argws-crm-base" \
            --output-dir dist

      - name: Publicar pacotes na versão ARGWS
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/ARGWS-CRM-${{ steps.version.outputs.value }}-full.zip
            dist/ARGWS-CRM-${{ steps.version.outputs.value }}-update.zip
            dist/ARGWS-CRM-${{ steps.version.outputs.value }}-SHA256SUMS.txt
